apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: geovictoria-arena
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: REPLACE_WITH_ARENA_SERVICE_ACCOUNT_EMAIL
      containerConcurrency: 64
      timeoutSeconds: 3600
      containers:
        - image: REPLACE_WITH_BUILT_IMAGE
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          env:
            - name: NODE_ENV
              value: production

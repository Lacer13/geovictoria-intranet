<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Desfase · Revisión de animación</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#071b23;color:#f8f3e8}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1280px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:clamp(26px,4vw,40px);margin:8px 0}p{color:#b8cdc9;margin:8px 0}.tag{font-size:12px;letter-spacing:.1em;color:#e6c68a;text-transform:uppercase}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px}.stage{border:1px solid #35534d;border-radius:20px;overflow:hidden;background:#102d36}canvas{display:block;width:100%;height:auto}.toolbar{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid #35534d}.toolbar input{flex:1;min-width:120px}aside{background:#10282e;border:1px solid #35534d;border-radius:20px;padding:20px}label{display:block;margin:16px 0 8px;color:#cfe0d6}select,button{font:inherit;background:#183a3e;color:#fff4df;border:1px solid #52736b;border-radius:10px;padding:10px 12px;cursor:pointer;width:100%}button.primary{background:#a3243b;border-color:#dc6f7a}.toolbar button{width:auto;min-width:100px}input[type=range]{accent-color:#e3b47c}input[type=checkbox]{accent-color:#b52c43}small{color:#a9c1bc;line-height:1.6}#status{margin-top:20px;min-height:24px}.back{color:#edcf91}footer{margin:24px 0;color:#a9c1bc;font-size:14px}@media(max-width:800px){body{padding:18px}.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}header{display:block}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><div><span class="tag">El taller de Navidad · Rival animado</span><h1>El Desfase cobra vida</h1><p>Carga, dispara y reacciona frente a VictorIA.</p></div><a class="back" href="/juego">Ir al juego →</a></header>
<main class="layout"><section class="stage"><canvas width="960" height="540" aria-label="Vista previa animada del rival y VictorIA"></canvas><div class="toolbar"><button id="play" class="primary">Pausar</button><input id="time" type="range" min="0" max="29" value="0" aria-label="Fotograma"><output id="frame">Cargando…</output></div></section>
<aside><div><label for="clip">Acción</label><select id="clip"><option value="battle">Combate real</option><option value="arrival">Entrada</option><option value="idle">Flotación</option><option value="moving">Avance</option><option value="charge">Carga</option><option value="shooting">Disparo y retroceso</option><option value="damage">Impacto</option><option value="defeat">Desactivación</option></select></div><div><label for="size">Tamaño</label><select id="size"><option value="80">Centinela · 80 px</option><option value="160" selected>Jefe · 160 px</option><option value="320">Detalle · 320 px</option></select></div><div><label for="speed">Velocidad</label><select id="speed"><option value="1">Normal</option><option value="0.25">Cámara lenta · ¼</option></select></div><div><label><input id="reduced" type="checkbox"> Movimiento reducido</label><label><input id="fallback" type="checkbox"> Probar sin imágenes</label><label><input id="anchor" type="checkbox"> Ver boquilla</label></div></aside></main>
<p id="status" role="status">Cargando sprites…</p><footer>8 poses originales · 168 fotogramas · Sin guardar puntos ni modificar el ranking.</footer>
<script type="module" src="./revision-v1.js"></script></body></html>

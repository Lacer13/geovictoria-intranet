<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CierreIA v2 · Revisión de actuación</title><style>body{font:16px system-ui;background:#12382c;color:#fff7e6;max-width:1100px;margin:auto;padding:24px}h1{font-size:30px}button,select,input{font:inherit;padding:10px;margin:6px}canvas{width:min(100%,320px);background:#e5edf0;border-radius:16px}img{max-width:100%}section{margin:25px 0}label{display:inline-block}a{color:#f2d491}</style><h1>CierreIA v2 · Disparo, Gran cierre y acuerdo cerrado</h1><p>Fuente ilustrada: tres expresiones y seis manos/accesorios. Un guion propio con maletín y asentimiento. Esta revisión no modifica puntajes.</p><canvas width="320" height="320"></canvas><div><label>Secuencia <select id="clip"><option value="shooting">Disparo normal · 0,2 s</option><option value="closing">Gran cierre · 0,3 s</option><option value="victory">Acuerdo cerrado · 3 s</option></select></label><button id="play">Reproducir</button><label><input type="checkbox" id="reduced"> Movimiento reducido</label><label>Fotograma <input type="range" id="frame" min="0" max="11" value="0"></label><p id="phase"></p></div><section><h2>Ocho poses</h2><img src="poses-v2-contacto.webp" alt="Reposo, apuntado, emisión, retroceso, Gran cierre, reacción potente, acuerdo y salida"></section><section><h2>Celebración completa · 72 fotogramas</h2><img src="celebracion-v2-contacto.webp" alt="Orden completo de entrada, presentación del maletín, acuerdo cerrado y reposo"></section><p><a href="/juego">Probar dentro del juego</a></p><script type="module">
import {sampleCierreiaV2,drawCierreiaV2,CIERREIA_V2_CLIPS} from '/src/game/cierreiaV2.js';
const image=new Image();image.src='rig-v2-alpha-local.png';await image.decode();const ctx=document.querySelector('canvas').getContext('2d'),clip=document.querySelector('#clip'),frame=document.querySelector('#frame'),play=document.querySelector('#play'),reduced=document.querySelector('#reduced');reduced.checked=matchMedia('(prefers-reduced-motion:reduce)').matches;let running=false,start=0;
function draw(){ctx.clearRect(0,0,320,320);const sample=sampleCierreiaV2(clip.value,Number(frame.value)/CIERREIA_V2_CLIPS[clip.value].fps,reduced.checked);drawCierreiaV2(ctx,image,sample);document.querySelector('#phase').textContent=`${Number(frame.value)+1}/${CIERREIA_V2_CLIPS[clip.value].frames} · ${sample.phase}`;}
function stop(){running=false;play.textContent='Reproducir';}clip.onchange=()=>{stop();frame.max=CIERREIA_V2_CLIPS[clip.value].frames-1;frame.value=0;draw();};frame.oninput=()=>{stop();draw();};reduced.onchange=()=>{stop();draw();};play.onclick=()=>{if(running){stop();return;}running=true;start=performance.now();play.textContent='Pausar';requestAnimationFrame(tick);};function tick(now){if(!running)return;frame.value=Math.min(Number(frame.max),Math.floor((now-start)*CIERREIA_V2_CLIPS[clip.value].fps/1000));draw();if(Number(frame.value)===Number(frame.max))stop();else requestAnimationFrame(tick);}document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});draw();
</script></html>
